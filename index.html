  <!-- spellcheck is inherited, so it is answered once, here, rather than on each
       of the ten boxes scattered across five files. The WebView's spellchecker
       has no Turkish dictionary: it underlined every Turkish word in the search
       box, in comments, in the settings fields — a red line under correct
       writing, in an app where red means something is being deleted. Spelling is
       a job we already have, and it is the writer's to ask for (Alt+Y). -->
  <body spellcheck="false">
    <div id="shell">
      <div id="tabs" class="tabs"></div>
      <div id="body" class="body"></div>
      <div id="status" class="status"></div>
    </div>
    <script>
      // Dev aid: no console is reachable here, so errors are painted on top.
      function showError(text) {
        const box = document.createElement("pre");
        box.style.cssText =
          "position:fixed;top:0;left:0;right:0;z-index:999;margin:0;padding:10px;" +
          "background:#7a1f1f;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto";
        box.textContent = text;
        document.body.append(box);
      }
      // CodeMirror reports a crashing plugin through the window.onerror
      // *property* (not an "error" listener) and then disables the plugin, so
      // the page keeps running and nothing else ever sees it.
      window.onerror = (message, source, line, column, error) => {
        showError("onerror: " + message + "\n" + ((error && error.stack) || ""));
      };
      const originalError = console.error;
      console.error = (...args) => {
        showError(
          "console.error: " +
            args
              .map((a) => (a && a.stack) || (a && a.message) || String(a))
              .join("\n"),
        );
        originalError.apply(console, args);
      };
      window.addEventListener("error", (event) =>
        showError(
          "HATA: " +
            (event.message || "") +
            "\n" +
            ((event.error && event.error.stack) || ""),
        ),
      );
      window.addEventListener("unhandledrejection", (event) =>
        showError(
          "REDDEDİLDİ: " +
            ((event.reason && (event.reason.stack || event.reason.message)) ||
              event.reason),
        ),
      );
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
